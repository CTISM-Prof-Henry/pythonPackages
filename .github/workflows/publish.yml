name: Testes e publicação

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executa testes
        run: pytest

      - name: Gera pacote
        run: python -m build

      - name: Publica no TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if python - "$VERSION" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request
          
          version = sys.argv[1]
          url = "https://test.pypi.org/pypi/pythonpackages/json"
          
          try:
              with urllib.request.urlopen(url, timeout=10) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  sys.exit(1)
              raise
          
          sys.exit(0 if version in payload.get("releases", {}) else 1)
          PY
          then
            echo "Versão ${VERSION} já existe no TestPyPI. Pulando upload."
            exit 0
          fi

          twine upload \
            --skip-existing \
            --repository-url https://test.pypi.org/legacy/ \
            dist/*